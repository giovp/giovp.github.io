<header class="band">
  <div class="band-inner">
    {% if site.navbar-links %}
      <nav class="sitenav" aria-label="Main navigation">
        {%- for link in site.navbar-links -%}
          <a href="{{ link[1] | relative_url }}">{{ link[0] }}</a>
        {%- endfor -%}
      </nav>
    {% endif %}
    <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="Toggle colour scheme" title="Toggle colour scheme">
      <span class="theme-toggle-icon" aria-hidden="true"></span>
    </button>
  </div>
</header>

{% if site.avatar and page.show-avatar != false %}
  <div class="avatar-wrap">
    <a class="avatar" href="{{ '/' | absolute_url }}" aria-label="{{ site.author | default: 'Home' }}">
      <img src="{{ site.avatar | relative_url }}" alt="{{ site.author | default: 'Home' }}">
    </a>
  </div>
{% else %}
  <div class="avatar-spacer"></div>
{% endif %}

{% if site.post_search %}
  {% include search.html %}
{% endif %}
